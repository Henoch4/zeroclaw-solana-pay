[package]
name = "solana-wallet"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ZeroClaw WIT plugin: Solana wallet toolkit — build unsigned transactions, generate Solana Pay URLs, verify payments, manage durable nonces. The pure core is host-testable."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
bincode = "1"
solana-pubkey = { version = "2", features = ["curve25519"] }
solana-instruction = "2"
solana-message = { version = "2", features = ["serde", "bincode"] }
solana-hash = "2"
solana-system-program = "2"
base64 = "0.22"

[dev-dependencies]
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
